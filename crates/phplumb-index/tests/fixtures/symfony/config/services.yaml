parameters:
    app.name: 'Demo'
    app.limit: 10
    env(APP_X): 'x'

services:
    _defaults:
        autowire: true

    # App\Service\Mailer sends the mail.
    App\:
        resource: '../src/'

    App\Service\Mailer: ~
    app.mailer: '@App\Service\Mailer'
    app.optional: '@?app.mailer'
    app.computed: '@=service("app.mailer")'
    App\Service\Notifier:
        class: App\Service\Mailer
        arguments: ['@app.mailer', !service { class: App\Service\Mailer }]
    app.alias:
        alias: app.mailer
    app.decorator:
        class: App\Service\Notifier
        decorates: app.mailer
